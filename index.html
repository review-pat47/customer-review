<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="firebase-version" content="5">

<title>Customer Reviews</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#fff;
  color:#202124;
  font-family:Arial,Helvetica,sans-serif;
}

.page{
  max-width:760px;
  margin:auto;
  padding:0 20px 110px;
}

.telegram{
  margin:18px 0 24px;
  padding:15px;
  text-align:center;
  background:#f1f9ff;
  border:1px solid #d7ecfa;
  border-radius:16px;
}

.telegram small{
  display:block;
  color:#777;
  margin-bottom:5px;
}

.telegram a{
  color:#1687d9;
  font-size:21px;
  font-weight:bold;
  text-decoration:none;
}

.summary{
  text-align:center;
  padding:10px 0 25px;
}

.score{
  font-size:68px;
  font-weight:800;
}

.stars{
  color:#f5b900;
  font-size:26px;
  letter-spacing:1px;
  margin:10px 0;
}

.count{
  color:#777;
  font-size:21px;
}

.bars{
  max-width:620px;
  margin:28px auto;
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:11px 0;
}

.label{
  width:30px;
  text-align:right;
}

.track{
  flex:1;
  height:13px;
  background:#ddd;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:#f5b900;
}

.p72{width:72%}
.p17{width:17%}
.p6{width:6%}
.p3{width:3%}
.p2{width:2%}

.review{
  position:relative;
  padding:23px 0;
  border-bottom:1px solid #eee;
}

.person{
  display:flex;
  align-items:center;
  gap:14px;
}

.avatar{
  width:64px;
  height:64px;
  flex:none;
  border-radius:50%;
  overflow:hidden;
  background:#dfe7ed;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:bold;
  color:#59656d;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.name{
  font-size:24px;
  font-weight:800;
}

.review-text{
  margin:0;
  color:#2d2d2d;
  font-size:20px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.delete{
  display:none;
  position:absolute;
  right:0;
  top:24px;
  border:0;
  border-radius:20px;
  padding:8px 13px;
  color:#b00020;
  background:#eee;
  font-weight:bold;
}

.admin-mode .delete{
  display:block;
}

.add{
  position:fixed;
  left:50%;
  bottom:16px;
  transform:translateX(-50%);
  width:min(710px,calc(100% - 40px));
  padding:17px;
  border:0;
  border-radius:35px;
  background:#ef2858;
  color:white;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
}

.admin{
  position:fixed;
  right:15px;
  bottom:90px;
  border:0;
  border-radius:25px;
  padding:10px 15px;
  background:#222;
  color:white;
  cursor:pointer;
}

.modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:1000;
  padding:20px;
  background:rgba(0,0,0,.6);
  align-items:center;
  justify-content:center;
}

.modal{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  padding:24px;
  background:white;
  border-radius:20px;
}

.modal h2{
  margin-top:0;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
  font-family:inherit;
}

.form-group textarea{
  height:110px;
  resize:vertical;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

.btn{
  border:0;
  border-radius:24px;
  padding:12px 20px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.btn-submit{
  background:#ef2858;
  color:white;
}

.btn-cancel{
  background:#e0e0e0;
}

.status{
  display:none;
  padding:11px;
  margin-bottom:15px;
  border-radius:10px;
  font-size:14px;
}

.loading{
  padding:30px 0;
  text-align:center;
  color:#777;
}

.error{
  padding:25px 0;
  text-align:center;
  color:#b00020;
}

@media(max-width:500px){

  .score{
    font-size:60px;
  }

  .name{
    font-size:22px;
  }

  .review-text{
    font-size:19px;
  }

}
</style>
</head>

<body>

<main class="page">

  <div class="telegram">
    <small>Telegram ID</small>
    <a
      href="https://t.me/GAYATHRI_REDDY1"
      target="_blank"
      rel="noopener">
      @GAYATHRI_REDDY1
    </a>
  </div>


  <section class="summary">

    <div class="score">4.6</div>

    <div class="stars">★★★★★</div>

    <div
      class="count"
      id="reviewCount">
      (2,529 reviews)
    </div>


    <div class="bars">

      <div class="row">
        <span class="label">5 ★</span>
        <div class="track">
          <div class="fill p72"></div>
        </div>
      </div>

      <div class="row">
        <span class="label">4 ★</span>
        <div class="track">
          <div class="fill p17"></div>
        </div>
      </div>

      <div class="row">
        <span class="label">3 ★</span>
        <div class="track">
          <div class="fill p6"></div>
        </div>
      </div>

      <div class="row">
        <span class="label">2 ★</span>
        <div class="track">
          <div class="fill p3"></div>
        </div>
      </div>

      <div class="row">
        <span class="label">1 ★</span>
        <div class="track">
          <div class="fill p2"></div>
        </div>
      </div>

    </div>

  </section>


  <div id="reviews-container">

    <div class="loading">
      Reviews loading...
    </div>

  </div>

</main>


<button
  class="add"
  onclick="openModal()">
  ＋ Add Your Review
</button>


<button
  class="admin"
  onclick="adminLogin()">
  Admin Login
</button>


<div
  class="modal-overlay"
  id="reviewModal">

  <div class="modal">

    <h2>Write a Review</h2>

    <div
      id="status"
      class="status">
    </div>


    <form id="reviewForm">

      <div class="form-group">

        <label for="userName">
          Your Name
        </label>

        <input
          id="userName"
          type="text"
          maxlength="50"
          placeholder="Enter your name"
          required>

      </div>


      <div class="form-group">

        <label for="userRating">
          Rating
        </label>

        <select
          id="userRating"
          required>

          <option value="5">
            ★★★★★ (5 Stars)
          </option>

          <option value="4">
            ★★★★☆ (4 Stars)
          </option>

          <option value="3">
            ★★★☆☆ (3 Stars)
          </option>

          <option value="2">
            ★★☆☆☆ (2 Stars)
          </option>

          <option value="1">
            ★☆☆☆☆ (1 Star)
          </option>

        </select>

      </div>


      <div class="form-group">

        <label for="userPhoto">
          Profile Photo
        </label>

        <input
          id="userPhoto"
          type="file"
          accept="image/*">

      </div>


      <div class="form-group">

        <label for="userComment">
          Your Review
        </label>

        <textarea
          id="userComment"
          maxlength="500"
          placeholder="Write your feedback here..."
          required></textarea>

      </div>


      <div class="modal-actions">

        <button
          type="button"
          class="btn btn-cancel"
          onclick="closeModal()">
          Cancel
        </button>

        <button
          type="submit"
          class="btn btn-submit"
          id="submitButton">
          Submit
        </button>

      </div>

    </form>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* Firebase Configuration */

const firebaseConfig = {

  apiKey:
  "AIzaSyDyNMpN3p-vo4-byi9AEklM97A3DzugBRs",

  authDomain:
  "my-review-77576.firebaseapp.com",

  projectId:
  "my-review-77576",

  storageBucket:
  "my-review-77576.firebasestorage.app",

  messagingSenderId:
  "551174640361",

  appId:
  "1:551174640361:web:9dc2c45bbc8a4b990fd678",

  measurementId:
  "G-FRVD05XZ41"

};


/* Admin Gmail */

const ADMIN_EMAIL =
"gayatrireddy3434@gmail.com";


/* Firebase start */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

const reviewsRef =
collection(db,"reviews");

let adminMode=false;


/* Default avatar */

const defaultAvatar =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 100 100">

<rect
width="100"
height="100"
rx="50"
fill="#dfe7ed"/>

<circle
cx="50"
cy="38"
r="18"
fill="#7b8790"/>

<path
d="M20 86c4-20 16-30 30-30s26 10 30 30"
fill="#7b8790"/>

</svg>
`);


/* Open modal */

window.openModal=function(){

  document.getElementById(
    "reviewModal"
  ).style.display="flex";

};


/* Close modal */

window.closeModal=function(){

  document.getElementById(
    "reviewModal"
  ).style.display="none";

  document.getElementById(
    "reviewForm"
  ).reset();

  document.getElementById(
    "status"
  ).style.display="none";

};


/* Status */

function statusMessage(
  message,
  success
){

  const box =
  document.getElementById("status");

  box.textContent=message;

  box.style.display="block";

  if(success){

    box.style.background="#e8f5e9";
    box.style.color="#1b5e20";

  }else{

    box.style.background="#ffebee";
    box.style.color="#b71c1c";

  }

}


/* Make review HTML */

function createReview(
  id,
  data
){

  const article =
  document.createElement("article");

  article.className="review";


  const person =
  document.createElement("div");

  person.className="person";


  const avatar =
  document.createElement("div");

  avatar.className="avatar";


  const image =
  document.createElement("img");

  image.src =
  data.photo || defaultAvatar;

  image.alt="Profile photo";


  avatar.appendChild(image);


  const name =
  document.createElement("div");

  name.className="name";

  name.textContent =
  data.name || "Anonymous";


  person.appendChild(avatar);
  person.appendChild(name);


  const stars =
  document.createElement("div");

  stars.className="stars";


  const rating =
  Number(data.rating) || 5;


  const starsList = [
    "",
    "★☆☆☆☆",
    "★★☆☆☆",
    "★★★☆☆",
    "★★★★☆",
    "★★★★★"
  ];


  stars.textContent =
  starsList[rating] || "★★★★★";


  const text =
  document.createElement("p");

  text.className="review-text";

  text.textContent =
  data.comment || "";


  const deleteButton =
  document.createElement("button");

  deleteButton.className="delete";

  deleteButton.textContent="Delete";

  deleteButton.onclick =
  function(){

    deleteReview(id);

  };


  article.appendChild(person);
  article.appendChild(stars);
  article.appendChild(text);
  article.appendChild(deleteButton);


  return article;

}


/*
IMPORTANT:
यह getDocs() इस्तेमाल करता है।
इससे page खुलते ही Firestore की
पूरी reviews collection पढ़ी जाएगी।
orderBy() नहीं है।
*/

async function loadReviews(){

  const container =
  document.getElementById(
    "reviews-container"
  );


  try{

    container.innerHTML =
    '<div class="loading">Reviews loading...</div>';


    const snapshot =
    await getDocs(reviewsRef);


    container.innerHTML="";


    if(snapshot.empty){

      container.innerHTML =
      '<div class="loading">No reviews found.</div>';

      return;

    }


    const reviews=[];


    snapshot.forEach(
      function(item){

        reviews.push({

          id:item.id,

          data:item.data()

        });

      }
    );


    /*
    अगर createdAt है तो नए review ऊपर।
    पुराने review जिनमें createdAt
    नहीं है, वे भी दिखेंगे।
    */

    reviews.sort(
      function(a,b){

        const aTime =
        a.data.createdAt &&
        typeof a.data.createdAt.toMillis ===
        "function"
        ?
        a.data.createdAt.toMillis()
        :
        0;


        const bTime =
        b.data.createdAt &&
        typeof b.data.createdAt.toMillis ===
        "function"
        ?
        b.data.createdAt.toMillis()
        :
        0;


        return bTime-aTime;

      }
    );


    reviews.forEach(
      function(item){

        container.appendChild(
          createReview(
            item.id,
            item.data
          )
        );

      }
    );


    document.getElementById(
      "reviewCount"
    ).textContent =
    "(" +
    (
      2529 + reviews.length
    ).toLocaleString() +
    " reviews)";


  }catch(error){

    console.error(
      "Firestore error:",
      error
    );


    container.innerHTML =
    `
    <div class="error">
      Reviews load nahi ho rahe.<br><br>
      Firebase connection error.
    </div>
    `;

  }

}


/* Page load होते ही reviews */

loadReviews();


/* Review submit */

document.getElementById(
  "reviewForm"
).addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const button =
    document.getElementById(
      "submitButton"
    );


    button.disabled=true;

    button.textContent=
    "Saving...";


    try{

      const name =
      document.getElementById(
        "userName"
      ).value.trim();


      const rating =
      Number(
        document.getElementById(
          "userRating"
        ).value
      );


      const comment =
      document.getElementById(
        "userComment"
      ).value.trim();


      const photoInput =
      document.getElementById(
        "userPhoto"
      );


      const file =
      photoInput.files &&
      photoInput.files.length
      ?
      photoInput.files[0]
      :
      null;


      let photo="";


      if(file){

        if(
          file.size >
          500 * 1024
        ){

          statusMessage(
            "Photo 500 KB se chhoti rakhein.",
            false
          );

          button.disabled=false;

          button.textContent="Submit";

          return;

        }


        photo =
        await new Promise(
          function(resolve,reject){

            const reader =
            new FileReader();


            reader.onload =
            function(){

              resolve(
                reader.result
              );

            };


            reader.onerror =
            function(){

              reject(
                reader.error
              );

            };


            reader.readAsDataURL(
              file
            );

          }
        );

      }


      await addDoc(
        reviewsRef,
        {

          name:name,

          rating:rating,

          comment:comment,

          photo:photo,

          createdAt:
          serverTimestamp()

        }
      );


      statusMessage(
        "Review successfully add ho gaya!",
        true
      );


      await loadReviews();


      setTimeout(
        function(){

          closeModal();

        },
        700
      );


    }catch(error){

      console.error(
        "Save error:",
        error
      );


      statusMessage(
        "Review save nahi hua: " +
        error.message,
        false
      );

    }


    button.disabled=false;

    button.textContent="Submit";

  }
);


/* Delete review */

async function deleteReview(id){

  if(
    !auth.currentUser ||
    auth.currentUser.email !==
    ADMIN_EMAIL
  ){

    alert(
      "Admin login required."
    );

    return;

  }


  const ok =
  confirm(
    "Delete this review?"
  );


  if(!ok)return;


  try{

    await deleteDoc(
      doc(
        db,
        "reviews",
        id
      )
    );


    await loadReviews();


  }catch(error){

    console.error(
      "Delete error:",
      error
    );


    alert(
      "Delete nahi hua. Firebase Rules check karein."
    );

  }

}


/* Admin login */

window.adminLogin =
async function(){

  const email =
  prompt(
    "Admin Gmail:"
  );


  if(!email)return;


  const password =
  prompt(
    "Admin Password:"
  );


  if(!password)return;


  try{

    const result =
    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    if(
      result.user.email !==
      ADMIN_EMAIL
    ){

      await signOut(auth);

      alert(
        "Ye authorized admin Gmail nahi hai."
      );

      return;

    }


    adminMode=true;

    document.body.classList.add(
      "admin-mode"
    );


    alert(
      "Admin login successful."
    );


  }catch(error){

    console.error(
      "Login error:",
      error
    );


    alert(
      "Admin login failed. Gmail ya password check karein."
    );

  }

};


/* Auth state */

onAuthStateChanged(
  auth,
  function(user){

    adminMode =
    !!user &&
    user.email ===
    ADMIN_EMAIL;


    document.body.classList.toggle(
      "admin-mode",
      adminMode
    );

  }
);

</script>

</body>
</html>
